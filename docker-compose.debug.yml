# Optional: expose each service directly (like the EC2 direct-URL tests in section 5.4)
# Run with:  docker compose -f docker-compose.yml -f docker-compose.debug.yml up -d
services:
  registration-service:
    ports: ["3001:3001"]
  login-service:
    ports: ["3002:3002"]
  event-service-1:
    ports: ["3003:3003"]
  event-service-2:
    ports: ["3004:3003"]
  assignment-service:
    ports: ["3006:3006"]
  mongo:
    ports: ["127.0.0.1:27017:27017"]
